<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TravelM4 Template</title>
    <style>
        body {
            background-image: url('https://thumbs.dreamstime.com/b/alpine-lake-lago-di-carezza-turquoise-water-reflection-mountains-forest-sunrise-dolomites-south-tyrol-italy-451911456.jpg');
            background-size: cover;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        header {
            background: #242b12;
            color: rgb(16, 232, 12);
            padding: 10px;
            text-align: right;
        }
        nav {
            background: #3d9fe5;
            padding: 10px;
            text-align: center;
        }
        nav a {
            color: rgb(45, 15, 239);
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }
    
        .hero {
            background-image: url('https://via.placeholder.com/1200x600'); /* Replace with Rio photo */
            background-size: cover;
            background-position: center;
            height: 500px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: rgb(185, 255, 10);
            text-shadow: 2px 2px 4px black;
        }
        .search-box {
            background: rgba(7, 142, 226, 0.8);
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }
        .search-box input, .search-box select, .search-box button {
            padding: 10px;
            margin: 5px;
        }
        .search-box button {
            background: rgb(104, 165, 196);
            color: rgb(228, 5, 187);
            border: none;
            cursor: pointer;
        }
        /* Second Section */
        .section {
            text-align: center;
            padding: 100px 20px;
        }

        .section h2 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .section p {
            color: #999;
            margin-bottom: 30px;
        }

        .small-search {
            margin: auto;
            width: 700px;
            display: flex;
            padding: 10px;
            box-shadow: 0 2px 15px #ddd;
        }

        .small-search input,
        .small-search select {
            padding: 12px;
            border: 1px solid #ddd;
            flex: 1;
        }

        .small-search button {
            background-color: #ff5261;
            color: white;
            border: none;
            padding: 10px 25px;
        }

        /* Cards */
        .destinations {
            background-color: #f5f5f5;
            padding: 70px 10%;
            text-align: center;
        }

        .cards {
            display: flex;
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            background-color: white;
            width: 33%;
            text-align: left;
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            text-align: center;
        }

        .card-content {
            padding: 20px;
        }

        .card h3 {
            margin-bottom: 10px;
        }

        .card p {
            color: #888;
            font-size: 14px;
        }

        /* Footer */
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 25px;
        }

        /* Mobile */
        @media (max-width: 700px) {

            .menu {
                display: none;
            }

            .search,
            .small-search {
                width: 90%;
                display: block;
            }

            .search input,
            .search select,
            .search button,
            .small-search input,
            .small-search select,
            .small-search button {
                width: 100%;
                margin: 5px 0;
            }

        }
    </style>
</head>
<body>
    <header>
        📞 +91- 8790245408 | 😏Mon – Sat 😎     🕐9am –  6pm 🕐
    </header>
    <nav><center>
        <a href="index.html">Home</a>

        <a href="booking.html">Booking</a>
        <a href="destinations.html">Destinations</a>
        <a href="pages.html">Pages</a>
        <a href="blog.html">Blog</a>
        <a href="help.html">Help</a>
    </center></nav>
    <section class="hero">
        <h1>Where do you want to go?</h1>
        <p>Lorem ipsum dolor sit amet, consectetur elit.</p>
        <div class="search-box">
            <input type="text" placeholder="Destination, city">
        
        <select><div>
                <option>Any Month</option>
                <option>October</option>
                <option>November</option>
            </select>
            <select>
                <option>Sort By Date</option>
                <option>Newest</option>
                <option>Oldest</option>
            </select>
        </div>
        <button  <center><button type="search">search🔍</button></center>

        
    </section>
</body>
</html>
